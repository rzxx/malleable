<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{CAPSULE_NAME}}</title>
    <style>
      :root {
        color: #172126;
        background: #f7f8f4;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 28px;
      }

      main {
        display: grid;
        align-content: center;
        justify-items: start;
        gap: 18px;
        max-width: 680px;
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 7vw, 64px);
        letter-spacing: 0;
        line-height: 0.98;
      }

      p {
        max-width: 52ch;
        margin: 0;
        color: #516260;
        font-size: 18px;
        line-height: 1.5;
      }

      button {
        min-height: 42px;
        border: 1px solid #94a59b;
        border-radius: 8px;
        padding: 0 16px;
        background: #223238;
        color: #fffaf1;
        font: inherit;
        cursor: pointer;
      }

      output {
        min-height: 24px;
        color: #2d6d50;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>{{CAPSULE_NAME}}</h1>
      <p>{{CAPSULE_DESCRIPTION}}</p>
      <button id="action">Use capsule</button>
      <output id="result"></output>
    </main>
    <script>
      const button = document.querySelector("#action");
      const result = document.querySelector("#result");
      let count = 0;

      button.addEventListener("click", () => {
        count += 1;
        result.textContent = `Used ${count} time${count === 1 ? "" : "s"}.`;
      });
    </script>
  </body>
</html>
