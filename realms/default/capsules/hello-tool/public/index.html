<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello Tool</title>
    <style>
      :root {
        color: #172126;
        background: #f5f7f2;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 28px;
      }

      main {
        display: grid;
        align-content: center;
        justify-items: start;
        gap: 18px;
        max-width: 640px;
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 7vw, 68px);
        letter-spacing: 0;
        line-height: 0.95;
      }

      p {
        max-width: 48ch;
        margin: 0;
        color: #526160;
        font-size: 18px;
        line-height: 1.5;
      }

      button {
        min-height: 42px;
        border: 1px solid #96a69b;
        border-radius: 8px;
        padding: 0 16px;
        background: #223238;
        color: #fffaf1;
        font: inherit;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      output {
        min-height: 24px;
        color: #2d6d50;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello Tool</h1>
      <p>
        This capsule is a real local artifact served by the daemon. Edit its files and refresh the
        shell.
      </p>
      <button id="action" type="button">Use capsule</button>
      <output id="result"></output>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
